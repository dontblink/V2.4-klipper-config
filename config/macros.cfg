#####################################################################
#   A better print_start macro for v2/trident
#####################################################################

## *** THINGS TO UNCOMMENT: ***
## Bed mesh (2 lines at 2 locations)
## Nevermore (if you have one)
## Z_TILT_ADJUST (For Trident only)
## QUAD_GANTRY_LEVEL (For V2.4 only)
## Beacon Contact logic (if you have one. 4 lines at 4 locations)

[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  {% if printer["gcode_macro PREHEAT_CHAMBER"].active %}
    {% set preheat_temp = printer["gcode_macro PREHEAT_CHAMBER"].target_temp|int %}
    {action_respond_info("Preheat Active: Waiting for chamber to reach " ~ preheat_temp ~ "C")}
    TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={preheat_temp}
    SET_GCODE_VARIABLE MACRO=PREHEAT_CHAMBER VARIABLE=active VALUE=False
  {% endif %}

  # Clear any lingering pause states
  CLEAR_PAUSE
  BED_MESH_CLEAR                                       # Clear old saved bed mesh (if any)
  
  # Heat hotend to 150c for nozzle scrubbing
  M140 S{target_bed}
  M104 S150

  G28 X Y                                                   # Home X and Y (leave Z for now to avoid crashing into bed if mesh is bad)
  M109 S150                                             # Wait for hotend to reach 150c
  
  # Fully home the printer
  G28 Z
  
  # Dock probe, run nozzle scrub, then re-attach probe
  DOCK_PROBE_UNLOCK
  NOZZLE_SCRUB
  ATTACH_PROBE_LOCK
  
  # Move to wait position
  G0 X{x_wait} Y{y_wait} F9000
  
  # Heat and wait for bed
  M190 S{target_bed}
  
  # Re-home Z for bed mesh calibration
  G28 Z
  G90
  QUAD_GANTRY_LEVEL
  G28 Z
  BED_MESH_CALIBRATE ADAPTIVE=1
  DOCK_PROBE_UNLOCK

  SMART_PARK
  M109 S{target_extruder}                               # Heat the hotend to set temp
  LINE_PURGE

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-15.0 F3600                ; retract filament

    G91                            ; relative positioning

    # move z as soon as possible
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    G0 Z{z_safe} F3600    ; move nozzle up
    
    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}


    G0 X{x_safe} Y{y_safe} F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G90                            ; absolute positioning
    G0 X{max_x} Y{max_y} F3600          ; park nozzle in corner


    # G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    # TURN_OFF_HEATERS
    # M107                           ; turn off fan
    # G1 Z2 F3000                    ; move nozzle up 2mm
    # G90                            ; absolute positioning
    # G0  X125 Y0 F3600            ; park nozzle at front
    BED_MESH_CLEAR
    _Probe_Unlock
    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
    {% if printer["gcode_macro SET_FANS_OFF_ON_END"].fans_off %}
      TURN_OFF_FANS_LIGHTS
      SET_GCODE_VARIABLE MACRO=SET_FANS_OFF_ON_END VARIABLE=fans_off VALUE=False
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the current print safely
rename_existing: CANCEL_PRINT_BASE
gcode:
  # Flush moves
  # M400
  # # Save current state
  # SAVE_GCODE_STATE NAME=cancel_state
  # # Relative mode for safe Z hop
  # G91

  # # Z-hop up 10 mm (adjust as needed)
  # G1 Z10 F600
  # # Back to absolute
  # G90

  # # Park head out of the way
  # {% if printer.toolhead.homed_axes == "xyz" %}
  #   # Example park position - change for your printer
  #   G1 X125 Y250 F9000
  # {% endif %}

  # # Small retract (tweak value for your material)
  # # G1 E-2.0 F3600
  # # Turn off heaters and fans
  # TURN_OFF_HEATERS
  # M107
  _Probe_Unlock
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
  CLEAR_PAUSE
  SDCARD_RESET_FILE
  PRINT_END


  # Restore state (so Klipper is consistent internally)
  # RESTORE_GCODE_STATE NAME=cancel_state

  # Call the original cancel logic (clears job, etc.)
  CANCEL_PRINT_BASE

################################
# Temp Wait Overrides
################################
[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}  ; Wait for bed temp (within 1 degree)
    {% endif %}

[gcode_macro PREHEAT_CHAMBER]
variable_active: False
variable_target_temp: 0
gcode:
  {% set chamber_temp = params.TEMP|default(50)|int %}
  SET_GCODE_VARIABLE MACRO=PREHEAT_CHAMBER VARIABLE=active VALUE=True
  SET_GCODE_VARIABLE MACRO=PREHEAT_CHAMBER VARIABLE=target_temp VALUE={chamber_temp}
  M140 S110 ; Set bed to 110
  M104 S150 ; Set extruder to 150
  M106 S255 ; Turn on part cooling fan to help circulate air
  {action_respond_info("Chamber Preheat: Bed 110C, Extruder 150C, Fan 100%. Waiting for chamber temp in PRINT_START...")}

[gcode_macro STOP_PREHEAT_CHAMBER]
gcode:
  SET_GCODE_VARIABLE MACRO=PREHEAT_CHAMBER VARIABLE=active VALUE=False
  M140 S0
  M104 S0
  M106 S0
  {action_respond_info("Chamber Preheat Cancelled. Heaters and Fan off.")}

[gcode_macro TURN_OFF_FANS_LIGHTS]
gcode:
  SET_FAN_SPEED FAN=bed_fans SPEED=0
  SET_LED LED=toolhead_leds RED=0 GREEN=0 BLUE=0
  SET_PIN PIN=caselight VALUE=0
  M106 S0

[gcode_macro SET_FANS_OFF_ON_END]
variable_fans_off: False
gcode:
    SET_GCODE_VARIABLE MACRO=SET_FANS_OFF_ON_END VARIABLE=fans_off VALUE=True # set fans_off variable

[gcode_macro TURN_ON_FANS_LIGHTS]
gcode:
  SET_FAN_SPEED FAN=bed_fans SPEED=1
  M106 S255
  SET_PIN PIN=caselight VALUE=0.1
  SET_LED LED=toolhead_leds RED=0.15 GREEN=0.15 BLUE=0.15

[gcode_macro NOZZLE_SCRUB]
description: Scrub the nozzle on a cleaning pad
variable_x_start: 0    ; X start position (adjust as needed)
variable_x_end: 28     ; X end position (adjust as needed)
variable_y_location: 263 ; Y position of cleaning pad (adjust as needed)
variable_z_location: 4 ; Z height above cleaning pad (adjust as needed)
variable_scub_count: 5  ; Number of scrub passes
gcode:
   ; Ensure printer is homed
   {% if printer.toolhead.homed_axes != "xyz" %}
       {action_respond_info("Homing printer first...")}
       G28
   {% endif %}
   
   ; Move to cleaning position (no probe attached)
   G90 ; Absolute positioning
   G0 X{printer["gcode_macro NOZZLE_SCRUB"].x_start|float} Y{printer["gcode_macro NOZZLE_SCRUB"].y_location|float} Z{printer["gcode_macro NOZZLE_SCRUB"].z_location|float} F10000
   
   ; Perform scrubbing passes
   {% set x_start = params.X_START|default(printer["gcode_macro NOZZLE_SCRUB"].x_start)|float %}
   {% set x_end = params.X_END|default(printer["gcode_macro NOZZLE_SCRUB"].x_end)|float %}
   {% set y_loc = params.Y_LOCATION|default(printer["gcode_macro NOZZLE_SCRUB"].y_location)|float %}
   {% set z_loc = params.Z_LOCATION|default(printer["gcode_macro NOZZLE_SCRUB"].z_location)|float %}
   {% set scrub_count = params.SCRUB_COUNT|default(printer["gcode_macro NOZZLE_SCRUB"].scub_count)|int %}
   
   {% for i in range(scrub_count) %}
       {action_respond_info("Scrub pass " ~ (i + 1) ~ " of " ~ scrub_count)}
       G0 X{x_start} F10000
       G0 X{x_end} F10000
   {% endfor %}
   
   ; Return to center position
   G0 X{printer.toolhead.axis_maximum.x|float / 2} Y{printer.toolhead.axis_maximum.y|float / 2} F10000
   {action_respond_info("Nozzle scrubbing complete")}
