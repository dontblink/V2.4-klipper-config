# This file contains common pin mappings for the BIGTREETECH Manta M8P V2.0
# To use this config, the firmware should be compiled for the
# STM32H723 with a "8KiB bootloader" and USB communication.

##########
[include klicky-probe.cfg]
[include sensorless_homing.cfg]
[include KAMP_Settings.cfg]
[exclude_object]
[display_status]
[pause_resume]
[include macros.cfg]
[include filament.cfg]

[virtual_sdcard]
path: /home/nirve/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[mcu]
canbus_uuid: 4693ee8d1bcd                        # Insert the CANbus-UUID of your Manta from the firmware flashing steps

[mcu H36]
canbus_uuid: 4cc033f06922                        # Insert the CANbus-UUID of your SB2209 RP2040 from the firmware flashing steps
# restart_method: command
##--------------------------------------------------------------------

######### 
# Plugins
#########
[adxl345]
cs_pin: H36:PB12
spi_software_sclk_pin: H36:PB10
spi_software_mosi_pin: H36:PB11
spi_software_miso_pin: H36:PB2
axes_map: -y,z,-x

[resonance_tester]
accel_chip: adxl345
probe_points:
    125,125,20 # an example
sweeping_period: 0

[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 90.2
shaper_type_y = mzv
shaper_freq_y = 65.6

# [adxl345_probe]
# mode: act
# probe_pin: H36:PC13
# int_pin: int1 # select either int1 or int2, depending on your choice of wiring
# act_thresh_x: 13
# act_thresh_y: 13
# # act_thresh_z: 6
# # tap_thresh: 20 # this needs to be tuned
# # tap_thresh_x: 20 # tap threshold for x homing, defaults to tap_thresh
# # tap_thresh_y: 20 # tap threshold for y homing, defaults to tap_thresh
# # tap_thresh_z: 20 # tap threshold for probing, defaults to tap_thresh
# # untrigger_thresh: 20 # needed for beacon, needs to be tuned
# # untrigger_thresh_x: 20 # untrigger threshold for x homing, defaults to untrigger_thresh
# # untrigger_thresh_y: 20 # untrigger threshold for y homing, defaults to untrigger_thresh
# # untrigger_thresh_z: 20 # untrigger threshold for z homing, defaults to untrigger_thresh
# # tap_dur: 0.01 # this needs to be tuned
# # tap_dur_x: 0.01 # tap duration for x homing, defaults to tap_dur
# # tap_dur_y: 0.01 # tap duration for y homing, defaults to tap_dur
# # tap_dur_z: 0.01 # tap duration for probing, defaults to tap_dur
# # speed: 20 # this needs to be tuned
# z_offset: 30
# # Adjust this to your liking
# # samples: 3
# # sample_retract_dist: 3.0
# # samples_result: median
# # samples_tolerance: 0.01
# # samples_tolerance_retries: 20
# enable_x_homing: True
# #   Define whether the adxl probe should be used to home x
# enable_y_homing: True
# #   Define whether the adxl probe should be used to home y
# enable_probe: False
# #   Define whether the adxl_probe should register as a probe
# log_homing_data: False
# #   Log accelerometer data to a file
# stepper_enable_dwell_time: 0.1
# #   Time to dwell after enabling the steppers before homing
# #disable_fans:
# #   Fans to be disabled while homing or probing
# #activate_gcode:
# #   Gcode to run before homing/probing
# #activate_gcode_x:
# #   Same as above but specific to homing x, defaults to activate_gcode
# #activate_gcode_y:
# #   Same as above but specific to homing y, defaults to activate_gcode
# #activate_gcode_z:
# #   Same as above but specific to homing/probing z, defaults to activate_gcode
# #deactivate_gcode:
# #   Gcode to run after homing/probing
# #deactivate_gcode_x:
# #   Same as above but specific to homing x, defaults to activate_gcode
# #deactivate_gcode_y:
# #   Same as above but specific to homing y, defaults to activate_gcode
# #deactivate_gcode_z:
# #   Same as above but specific to homing/probing z, defaults to activate_gcode

[force_move]
enable_force_move: True

[printer]
kinematics: corexy
max_velocity: 400  
max_accel: 11000             #Max 4000
max_z_velocity: 100          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 1000
square_corner_velocity: 12.0

#####################################################################
#   Mcu & Driver Temperature
#####################################################################

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor SoC]
sensor_type: temperature_host

[temperature_sensor Chamber]
sensor_type: PT1000
sensor_pin: PB0
pullup_resistor: 2200

[temperature_sensor toolhead_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: H36
min_temp: 0
max_temp: 150

[temperature_sensor Extruder_Temp]
sensor_type: Generic 3950
sensor_pin: H36:PA3
min_temp:0
max_temp:150

#####################################################################
#   Voltage Monitor
#####################################################################

[adc_temperature 5V_Monitor]
temperature1: 5
voltage1: 3.0
temperature2: 4
voltage2: 2.4
temperature3: 3
voltage3: 1.8

[adc_temperature 24V_Monitor]
temperature1: 24
voltage1: 3.13
temperature2: 22
voltage2: 2.87
temperature3: 21
voltage3: 2.74

[temperature_sensor 5V_Monitor]
sensor_type: 5V_Monitor
sensor_pin: H36:PA0   #5V_MON
adc_voltage: 3.3
voltage_offset: 0

[temperature_sensor 24V_Monitor]
sensor_type: 24V_Monitor
sensor_pin: H36:PA4   #24V_MON
adc_voltage: 3.3
voltage_offset: 0

#####################################################################
#   X/Y Stepper Settings
#####################################################################

## Y Stepper on Motor1 (A Motor)
[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper

endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 247
position_max: 247
homing_speed: 100   #Max 100
homing_retract_dist: 0
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PC13
diag_pin: ^PF4
driver_SGTHRS: 120 # 255 is most sensitive value, 0 is least sensitive
interpolate: True
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 1


## X Stepper on Motor2(B Motor)
[stepper_y]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
position_min: 0
position_endstop: 264
position_max: 264
homing_speed: 80  #Max 100
homing_retract_dist: 0
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PE3
diag_pin: ^PF3
driver_SGTHRS: 105 # 255 is most sensitive value, 0 is least sensitive
interpolate: True
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 1

#####################################################################
#   Z Stepper Settings
#####################################################################

##  Z1 Stepper - Back Left on Motor4
[stepper_z]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
position_max: 240
position_min: 0
homing_speed: 10
second_homing_speed: 10
homing_retract_dist: 3

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PB5
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 1

## Z0 Stepper - Front Left on MOTOR3_A
[stepper_z1]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PB9
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 1

##  Z2 Stepper - Rear Right on Motor5
[stepper_z3]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z3]
uart_pin: PG14
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 1

##  Z3 Stepper - Front Right on Motor6
[stepper_z2]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PG10
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 1

#####################################################################
#   Extruder
#####################################################################

#   E0 on H36
[extruder]
step_pin: H36:PB9
dir_pin: !H36:PB8
enable_pin: !H36:PB7
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
rotation_distance: 22.225372078   #Bondtech 5mm Drive Gears
gear_ratio: 50:8
microsteps: 16
full_steps_per_rotation: 200    # 200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.600
filament_diameter: 1.75
heater_pin: H36:PA7
sensor_type: PT1000
sensor_pin: H36:PA6
pullup_resistor: 2200
min_temp: -273.15
max_temp: 360
max_power: 1.0
min_extrude_temp: 170
#pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 5000
max_extrude_only_distance: 200

##  E0 on H36
[tmc2209 extruder]
uart_pin: H36:PC14
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
##  SSR Pin - HE0
heater_pin: PA0
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: Generic 3950
sensor_pin: PB1
pullup_resistor: 4700

##  Adjust max_power so it doesn't exceed the SSR rating. The Omron G3NA-210B-DC5 SSR is rated at 4 amps without a heatsink.
##  The formula is "4 / (Wattage_of_bed_heater / Mains_voltage) = max_power"
##  If max_power is greater than 1.0, use 1.0
max_power: 1.0
min_temp: 0
max_temp: 120

#####################################################################
#   Probe
#####################################################################

[probe]
##  Inductive Probe
##  This probe is not used for Z height, only Quad Gantry Leveling
##  NPN and PNP proximity switch types can be set by jumper
pin: ^H36:PA10
x_offset: 0
y_offset: 0
#z_offset: 17.5
speed: 10.0
samples: 2
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 5

#####################################################################
#   Fan Control
#####################################################################

[heater_fan he_fan]
pin: H36:PA9
max_power:1.0
shutdown_speed:0.0
cycle_time:0.5
hardware_pwm:false
kick_start_time:0.10
off_below:0.1
heater: extruder
heater_temp: 50
fan_speed: 1.0

tachometer_pin: H36:PC6
# Please make sure the feedback level does not exceed 5V!
tachometer_ppr: 2
tachometer_poll_interval: 0.0015

[multi_pin part_fans]
pins: H36:PB13, H36:PA5 

[fan]
pin: multi_pin:part_fans
max_power:1.0
shutdown_speed:0.0
cycle_time:0.01
hardware_pwm:false
kick_start_time:0.10
off_below:0.1

[fan_generic bed_fans]
pin: PA3
max_power: 1.0
shutdown_speed:0.0
cycle_time:0.1
hardware_pwm: false
kick_start_time: 0.10
off_below: 0.1

[controller_fan M8P_fan]
pin: PF8
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.5
hardware_pwm: false
kick_start_time:0.10
off_below: 0.1

fan_speed: 0.25
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when a heater or stepper driver is active.
#   The default is 1.0
idle_timeout: 30
#   The amount of time (in seconds) after a stepper driver or heater
#   was active and the fan should be kept running. The default
#   is 30 seconds.
idle_speed: 0.11
#   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when a heater or stepper driver was active and
#   before the idle_timeout is reached. The default is fan_speed.
#heater:
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3
#   Name of the config section defining the heater/stepper that this fan
#   is associated with. If a comma separated list of heater/stepper names
#   is provided here, then the fan will be enabled when any of the given
#   heaters/steppers are enabled. The default heater is "extruder", the
#   default stepper is all of them.



#####################################################################
#   LED Control
#####################################################################

[output_pin caselight]
# Chamber Lighting - HE2 Connector (Optional)
pin: PA1
pwm:true
shutdown_value: 0
value: 0
cycle_time: 0.01

[neopixel toolhead_leds]
pin: H36:PA8 #IO.2/RGB0
chain_count: 3
color_order: GRB, GRB, GRB
initial_RED: 0 
initial_GREEN: 0
initial_BLUE: 0
initial_WHITE: 0

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 600

# [safe_z_home]
# ##  XY Location of the Z Endstop Switch
# ##  Update -10,-10 to the XY coordinates of your endstop pin 
# ##  (such as 157,305) after going through Z Endstop Pin
# ##  Location Definition step.
# home_xy_position:125,125
# speed:100
# z_hop:10

[quad_gantry_level]
##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions

gantry_corners:
  -60,-10
  310, 320
#  Probe points
points:
  25,25
  25,225
  225,225
  225,25

speed: 400
horizontal_move_z: 20
retries: 5
retry_tolerance: 0.01
max_adjust: 10

[bed_mesh]
speed: 400
horizontal_move_z: 20
mesh_min: 30, 30        # Adjust these based on your probe offset
mesh_max: 240, 250      # Adjust these based on your probe offset
probe_count: 7, 7
algorithm: bicubic
fade_start: 1
fade_end: 10

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
number_of_results_to_keep: 10
#    This setting defines how many results you want to keep in the result folder.
#    Once the specified number is exceeded, older results will be automatically deleted
#    to free up space on the SD card and avoid cluttering the results folder.
# keep_raw_data: False
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
#    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
#    If set to False, the macros will be hidden but still accessible from the console by typing
#    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
timeout: 600
#    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
#    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
#    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.


